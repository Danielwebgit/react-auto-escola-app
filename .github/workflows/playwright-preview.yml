name: Preview Deploy + Playwright Tests

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

permissions:
  contents: read
  pull-requests: write
  issues: write

env:
  DEPLOY_BASE: /root/playWright-end-app-for-test
  DOMAIN: ${{ vars.TEST_DOMAIN }}

jobs:
  deploy-and-test:
    if: github.event.action != 'closed'
    runs-on: [self-hosted, preview-server]

    steps:
      - name: Compute branch slug
        id: branch
        run: |
          BRANCH_SLUG=$(echo "${{ github.head_ref }}" \
            | sed 's/[^a-zA-Z0-9]/-/g' \
            | tr '[:upper:]' '[:lower:]' \
            | cut -c1-40 \
            | sed 's/-*$//')
          TEST_URL="http://${BRANCH_SLUG}.dev.${{ env.DOMAIN }}"
          echo "slug=$BRANCH_SLUG"  >> "$GITHUB_OUTPUT"
          echo "test_url=$TEST_URL" >> "$GITHUB_OUTPUT"

      - name: Deploy branch on test server
        run: |
          sudo env DEPLOY_BASE="${{ env.DEPLOY_BASE }}" DOMAIN="${{ env.DOMAIN }}" \
            bash "${{ env.DEPLOY_BASE }}/.github/scripts/test-deploy-manager.sh" \
            deploy "${{ github.head_ref }}"

      - name: Wait for application to be ready
        run: |
          TEST_URL="${{ steps.branch.outputs.test_url }}"
          echo "Aguardando $TEST_URL..."
          for i in $(seq 1 30); do
            if curl -sf "$TEST_URL" >/dev/null 2>&1; then
              echo "Pronto na tentativa $i."
              exit 0
            fi
            echo "Tentativa $i/30..."
            sleep 3
          done
          echo "Timeout aguardando a aplicação." >&2
          exit 1

      - name: Run Playwright tests on server
        id: playwright
        continue-on-error: true
        run: |
          sudo env DEPLOY_BASE="${{ env.DEPLOY_BASE }}" \
            bash "${{ env.DEPLOY_BASE }}/.github/scripts/test-deploy-manager.sh" \
            run-tests "${{ steps.branch.outputs.slug }}" "${{ steps.branch.outputs.test_url }}"

      - name: Copy Playwright report
        if: always()
        run: |
          PW_DIR="${{ env.DEPLOY_BASE }}/play-wright-react-auto-escola-app"
          rm -rf playwright-report
          mkdir -p playwright-report
          sudo cp -r "$PW_DIR/playwright-report/." ./playwright-report/ 2>/dev/null \
            || echo "Aviso: relatório não encontrado."
          sudo cp -r "$PW_DIR/global-setup-debug" ./playwright-report/global-setup-debug 2>/dev/null \
            || true
          sudo chown -R "$(id -u):$(id -g)" ./playwright-report

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ steps.branch.outputs.slug }}
          path: playwright-report
          retention-days: 7

      - name: Comment on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const passed  = "${{ steps.playwright.outcome }}" === "success";
            const testUrl = "${{ steps.branch.outputs.test_url }}";
            const runUrl  = `https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            const body = [
              "## Playwright Preview Test",
              "",
              `**Branch:** \`${{ github.head_ref }}\``,
              `**Preview URL:** [${testUrl}](${testUrl})`,
              "",
              passed
                ? "✅ Todos os testes passaram."
                : "❌ Testes falharam — veja os logs e o relatório.",
              "",
              `[📊 Ver relatório](${runUrl})`,
            ].join("\n");
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

  cleanup:
    if: github.event.action == 'closed'
    runs-on: [self-hosted, preview-server]

    steps:
      - name: Compute branch slug
        id: branch
        run: |
          BRANCH_SLUG=$(echo "${{ github.head_ref }}" \
            | sed 's/[^a-zA-Z0-9]/-/g' \
            | tr '[:upper:]' '[:lower:]' \
            | cut -c1-40 \
            | sed 's/-*$//')
          echo "slug=$BRANCH_SLUG" >> "$GITHUB_OUTPUT"

      - name: Cleanup preview deploy
        run: |
          sudo env DEPLOY_BASE="${{ env.DEPLOY_BASE }}" DOMAIN="${{ env.DOMAIN }}" \
            bash "${{ env.DEPLOY_BASE }}/.github/scripts/test-deploy-manager.sh" \
            cleanup "${{ steps.branch.outputs.slug }}"
