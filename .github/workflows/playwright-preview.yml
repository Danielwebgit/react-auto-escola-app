name: Preview Deploy + Playwright Tests

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

env:
  DEPLOY_BASE: /root/playWright-end-app-for-test
  DOMAIN: ${{ secrets.TEST_DOMAIN }}
  SERVER_USER: ${{ secrets.TEST_SERVER_USER }}
  SERVER_HOST: ${{ secrets.TEST_SERVER_HOST }}
  SERVER_PORT: ${{ secrets.TEST_SERVER_PORT || '22' }}

jobs:
  deploy-and-test:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.TEST_SERVER_SSH_KEY }}

      - name: Compute branch slug and port
        id: branch
        run: |
          BRANCH_SLUG=$(echo "${{ github.head_ref }}" \
            | sed 's/[^a-zA-Z0-9]/-/g' \
            | tr '[:upper:]' '[:lower:]' \
            | cut -c1-20)
          PORT=$(( 10000 + $(echo "$BRANCH_SLUG" | cksum | cut -d' ' -f1) % 5000 ))
          TEST_URL="https://${BRANCH_SLUG}.dev.${{ env.DOMAIN }}"
          echo "slug=$BRANCH_SLUG"  >> "$GITHUB_OUTPUT"
          echo "port=$PORT"         >> "$GITHUB_OUTPUT"
          echo "test_url=$TEST_URL" >> "$GITHUB_OUTPUT"

      - name: Deploy branch on test server
        run: |
          ssh -o StrictHostKeyChecking=accept-new \
              -p "${{ env.SERVER_PORT }}" \
              "${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}" \
              "DEPLOY_BASE='${{ env.DEPLOY_BASE }}' DOMAIN='${{ env.DOMAIN }}' \
               bash '${{ env.DEPLOY_BASE }}/.github/scripts/test-deploy-manager.sh' \
               deploy '${{ github.head_ref }}' '${{ steps.branch.outputs.port }}'"

      - name: Wait for application to be ready
        run: |
          TEST_URL="${{ steps.branch.outputs.test_url }}"
          echo "Aguardando $TEST_URL..."
          for i in $(seq 1 30); do
            if curl -sf -k "$TEST_URL" >/dev/null 2>&1; then
              echo "Pronto na tentativa $i."
              exit 0
            fi
            echo "Tentativa $i/30..."
            sleep 3
          done
          echo "Timeout aguardando a aplicação." >&2
          exit 1

      - name: Run Playwright tests on server
        id: playwright
        continue-on-error: true
        run: |
          ssh -o StrictHostKeyChecking=accept-new \
              -p "${{ env.SERVER_PORT }}" \
              "${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}" \
              "DEPLOY_BASE='${{ env.DEPLOY_BASE }}' \
               bash '${{ env.DEPLOY_BASE }}/.github/scripts/test-deploy-manager.sh' \
               run-tests '${{ steps.branch.outputs.slug }}' '${{ steps.branch.outputs.test_url }}'"

      - name: Copy Playwright report from server
        if: always()
        run: |
          mkdir -p playwright-report
          scp -r \
              -o StrictHostKeyChecking=accept-new \
              -P "${{ env.SERVER_PORT }}" \
              "${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}:${{ env.DEPLOY_BASE }}/play-wright-react-auto-escola-app/playwright-report/." \
              ./playwright-report/ \
            || echo "Aviso: relatório não encontrado."

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ steps.branch.outputs.slug }}
          path: playwright-report
          retention-days: 7

      - name: Comment on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const passed  = "${{ steps.playwright.outcome }}" === "success";
            const testUrl = "${{ steps.branch.outputs.test_url }}";
            const runUrl  = `https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            const body = [
              "## Playwright Preview Test",
              "",
              `**Branch:** \`${{ github.head_ref }}\``,
              `**Preview URL:** [${testUrl}](${testUrl})`,
              "",
              passed
                ? "✅ Todos os testes passaram."
                : "❌ Testes falharam — veja os logs e o relatório.",
              "",
              `[📊 Ver relatório](${runUrl})`,
            ].join("\n");
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

  cleanup:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.TEST_SERVER_SSH_KEY }}

      - name: Compute branch slug
        id: branch
        run: |
          BRANCH_SLUG=$(echo "${{ github.head_ref }}" \
            | sed 's/[^a-zA-Z0-9]/-/g' \
            | tr '[:upper:]' '[:lower:]' \
            | cut -c1-20)
          echo "slug=$BRANCH_SLUG" >> "$GITHUB_OUTPUT"

      - name: Cleanup preview deploy
        run: |
          ssh -o StrictHostKeyChecking=accept-new \
              -p "${{ env.SERVER_PORT }}" \
              "${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}" \
              "DEPLOY_BASE='${{ env.DEPLOY_BASE }}' DOMAIN='${{ env.DOMAIN }}' \
               bash '${{ env.DEPLOY_BASE }}/.github/scripts/test-deploy-manager.sh' \
               cleanup '${{ steps.branch.outputs.slug }}'"
